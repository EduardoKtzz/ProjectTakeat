<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor - Login</title>
  <link rel="stylesheet" href="./css/gestor.css" />
</head>
<body>
  <header class="topo">
    <div class="container topo__conteudo">
      <div class="marca">
        <span class="marca__ponto"></span>
        <span class="marca__nome">Área do Gestor</span>
      </div>
      <a class="link" href="/">Voltar</a>
    </div>
  </header>

  <main class="container">
    <section id="tela-login" class="cartao">
      <h1 class="titulo">Entrar como Gestor</h1>
      <p class="subtitulo">Use seu e-mail e senha de gestor.</p>

      <form id="form-login" class="formulario">
        <label class="rotulo">E-mail</label>
        <input id="email" class="input" type="email" placeholder="gestor@exemplo.com" required />

        <label class="rotulo">Senha</label>
        <input id="senha" class="input" type="password" placeholder="Sua senha" required />

        <button id="botao-entrar" class="botao botao--primario" type="submit">Entrar</button>
        <p class="dica" id="mensagem"></p>
      </form>
    </section>

    <section id="tela-painel" class="cartao escondido">
        <div class="linha">
            <div>
            <h2 class="titulo2">Painel do Gestor</h2>
            <p class="subtitulo2" id="gestor-info"></p>
            </div>
            <button id="botao-sair" class="botao botao--fantasma">Sair</button>
        </div>

        <div class="caixa" style="margin-top:14px;">
            <label class="rotulo">ID do Restaurante</label>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input id="restaurante-id" class="input" placeholder="Ex: 1" />
            <button id="botao-carregar" class="botao botao--primario" type="button">Carregar cartões</button>
            </div>
            <p class="dica">Use o ID do restaurante para listar/criar cartões e atualizar WhatsApp.</p>
        </div>

        <div class="grid" style="margin-top:16px;">
            <!-- Criar cartão -->
            <div class="cartao" style="margin-top:0;">
            <h3 class="titulo3">Criar Gift Card (manual)</h3>

            <form id="form-criar" class="formulario">
                <label class="rotulo">Telefone do presenteado</label>
                <input id="telefone-presenteado" class="input" placeholder="+5511999999999" required />

                <label class="rotulo">Valor inicial (R$)</label>
                <input id="valor-inicial" class="input" type="number" min="1" step="0.01" placeholder="Ex: 100" required />

                <label class="rotulo">Validade (opcional)</label>
                <input id="validade-em" class="input" type="date" />

                <label class="rotulo">Código (opcional)</label>
                <input id="codigo" class="input" placeholder="Deixe vazio para gerar" />

                <button class="botao botao--primario" type="submit">Criar</button>
                <p class="dica" id="mensagem-criar"></p>
            </form>
            </div>

            <!-- Atualizar WhatsApp -->
            <div class="cartao" style="margin-top:0;">
            <h3 class="titulo3">WhatsApp do Restaurante</h3>

            <form id="form-whatsapp" class="formulario">
                <label class="rotulo">WhatsApp</label>
                <input id="whatsapp" class="input" placeholder="+5511999999999" required />
                <button class="botao botao--fantasma" type="submit">Atualizar</button>
                <p class="dica" id="mensagem-whatsapp"></p>
            </form>
            </div>
        </div>

        <!-- Lista -->
        <div class="cartao" style="margin-top:16px;">
            <div class="linha" style="align-items:center;">
            <h3 class="titulo3" style="margin:0;">Cartões do Restaurante</h3>
            <button id="botao-recarregar" class="botao botao--fantasma" type="button">Recarregar</button>
            </div>

            <div id="lista" style="margin-top:12px; display:flex; flex-direction:column; gap:10px;"></div>
        </div>
        </section>

    <div id="toast" class="toast escondido"></div>
  </main>

  <script src="../gestor/js/gestor.js"></script>
</body>
</html>
