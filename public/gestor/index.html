<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor • Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- NAVBAR (igual cliente) -->
    <header class="navbar">
      <div class="navbar__content">
        <!-- Logo -->
        <div class="logo-area">
          <a class="topbar__brand" href="../cliente/compra.html">
            <img
              src="../cliente/assets/image-removebg-preview.png"
              class="topbar__logo"
              alt="Logo"
            />
          </a>
        </div>

        <!-- Menu -->
        <nav class="menu-area" aria-label="Menu principal">
          <ul class="topbar__menu">
            <li><a class="topbar__link" href="../cliente/compra.html">Comprar GiftCard</a></li>
            <li><a class="topbar__link" href="../cliente/consulta.html">Consultar meu GiftCard</a></li>
          </ul>
        </nav>

        <!-- Perfil -->
        <div class="perfil-area">
          <a class="icone-perfil" href="../gestor/login.html" title="Área do gestor" aria-label="Área do gestor">
            <i class="fa-solid fa-user"></i>
          </a>
        </div>
      </div>
    </header>

    <!-- HERO -->
    <section class="heroCard">
      <div class="heroCard__content">
        <h1 class="heroCard__title">
          Entrar como <span class="destaque-vermelho">Gestor</span>
        </h1>
        <p class="heroCard__subtitle">
          Acesse o painel administrativo para gerenciar Gift Cards.
        </p>
      </div>
    </section>

    <!-- LOGIN CENTRAL -->
    <main class="login-wrap">
      <section id="tela-login" class="card-login" aria-label="Login do gestor">
        <h2 class="card-login__title">Login do Gestor</h2>
        <p class="card-login__subtitle">Use seu e-mail e senha cadastrados.</p>

        <form id="form-login" class="form-login">
          <label class="form-login__label" for="email">E-mail</label>
          <input id="email" class="form-login__input" type="email" placeholder="gestor@exemplo.com" required />

          <label class="form-login__label" for="senha">Senha</label>
          <input id="senha" class="form-login__input" type="password" placeholder="Digite sua senha" required />

          <button id="botao-entrar" class="btn btn--primary btn--full" type="submit">
            Entrar
          </button>

          <p class="msg" id="mensagem"></p>
        </form>
      </section>
    </main>

    <script src="./js/script.js"></script>
  </body>
</html>
